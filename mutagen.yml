sync:
  defaults:
    mode: "two-way-safe"
    symlink:
      mode: "portable"
    ignore:
      vcs: true
      paths:
        # --- 1. 忽略 Mutagen 本身的設定檔與鎖定檔 ---
        - "mutagen.yml"
        - "mutagen.yml.lock"

        # --- 2. 忽略 Python 快取檔 ---
        - "__pycache__/"
        - "*.pyc"

        # --- 3. Level 1 原始 Delphes 大資料與 Level 2 精簡訓練資料 (只存 Cluster) ---
        - "Sample/MG5/"
        - "Sample/Sherpa/"
        - "Sample/MG_sample"
        - "Sample/Parquet/"
        - "Sample/selection_results/"
        - "*.root"
        - "*.hepmc"
        - "*.lhe"
        - "*.h5"

        # --- 4. LaTeX 編譯中間暫存檔 ---
        - "*.aux"
        - "*.log"
        - "*.fls"
        - "*.fdb_latexmk"
        - "*.synctex.gz"
        - "*.toc"
        - "*.bbl"
        - "*.blg"
        - "*.out"
        - "*.xdv"

        # --- 5. 作業調度系統日誌檔 ---
        - "*.o[0-9]*"
        - "*.e[0-9]*"

  # --- 目標 1: NCTS Cluster ---
  ntu-cluster:
    alpha: "."
    beta: "fyhsieh@140.112.102.158:/datagpunas-1/fyhsieh/longitudinal_W"

  # --- 目標 2: ASGC DiCOS Cluster (使用 SSH 別名 DiCOS) ---
  asgc-cluster:
    alpha: "."
    beta: "DiCOS:/ceph/work/HEP/fengyang/longitudinal_W"
