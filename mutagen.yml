sync:
  defaults:
    mode: "two-way-resolved"
    symlink:
      mode: "portable"
    ignore:
      vcs: true
      paths:
        # --- 1. 忽略 Mutagen 鎖定檔 ---
        - "mutagen.yml.lock"

        # --- 2. 忽略 Python 虛擬環境與快取檔 ---
        - ".venv/"
        - "__pycache__/"

        # --- 3. Level 1 原始 Delphes 大資料與 Level 2 精簡訓練資料 (只存 Cluster) ---
        - "Sample/MG5/"
        - "Sample/Sherpa/"
        - "Sample/MG_sample"
        - "Sample/Parquet/"
        - "*.root"
        - "*.hepmc"
        - "*.lhe"
        - "*.h5"

        # --- 4. LaTeX 編譯中間暫存檔與系統快取 ---
        - "*.aux"
        - "*.log"
        - "*.fls"
        - "*.fdb_latexmk"
        - "*.synctex.gz"
        - "*.bbl"
        - "*.blg"
        - "*.out"
        - "*.xdv"
        - "*.toc"
        - "*.nav"
        - "*.snm"
        - "*.vrb"
        - ".DS_Store"

  # --- 目標 1: NCTS Intel Cluster (目前主力) ---
  NCTS-Intel:
    alpha: "."
    beta: "fyhsieh@140.112.102.158:/datagpunas-1/fyhsieh/longitudinal_W"
    ignore:
      paths:
        - ".agent_tasks_amd/"

  # --- 目標 2: ASGC DiCOS Cluster (備用，若需使用請取消註解) ---
  # ASGC-DiCOS:
  #   alpha: "."
  #   beta: "DiCOS:/ceph/work/HEP/fengyang/longitudinal_W"

  # --- 目標 3: NCTS AMD Cluster (CPU 事件生成專用) ---
  NCTS-AMD:
    alpha: "."
    beta: "fyhsieh@140.112.102.218:/amd05-1/fyhsieh/longitudinal_W"
    ignore:
      paths:
        - ".agent_tasks_intel/"
